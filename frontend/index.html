<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name Dashboard — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { 50:'#eef2ff',100:'#e0e7ff',500:'#6366f1',600:'#4f46e5',700:'#4338ca',900:'#1e1b4b' } } } }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-gray-950 via-gray-900 to-brand-900 flex items-center justify-center min-h-screen">
  <div class="relative">
    <!-- Glow effect -->
    <div class="absolute -inset-1 bg-gradient-to-r from-brand-600 to-purple-600 rounded-2xl blur opacity-20"></div>
    <div class="relative bg-gray-900/80 backdrop-blur-xl border border-gray-700/50 p-10 rounded-2xl shadow-2xl w-full max-w-sm">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-brand-600/20 rounded-2xl mb-4">
          <span class="text-3xl">⚡</span>
        </div>
        <h1 class="text-white text-2xl font-bold">SPVI Dashboard</h1>
        <p class="text-gray-400 text-sm mt-1">AWS Resource Control Panel</p>
      </div>
      <div id="error" class="hidden bg-red-500/20 border border-red-500/50 text-red-300 p-3 rounded-lg mb-4 text-sm text-center"></div>
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="text-gray-400 text-xs font-medium uppercase tracking-wider mb-2 block">Username</label>
          <input id="username" type="text" class="w-full bg-gray-800/50 border border-gray-700/50 text-white p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition placeholder-gray-500" placeholder="Enter username">
        </div>
        <div>
          <label class="text-gray-400 text-xs font-medium uppercase tracking-wider mb-2 block">Password</label>
          <input id="password" type="password" class="w-full bg-gray-800/50 border border-gray-700/50 text-white p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition placeholder-gray-500" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-brand-600 to-purple-600 hover:from-brand-500 hover:to-purple-500 text-white font-semibold py-3 rounded-xl transition-all duration-200 shadow-lg shadow-brand-600/25 hover:shadow-brand-500/40 hover:-translate-y-0.5">Sign In</button>
      </form>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
